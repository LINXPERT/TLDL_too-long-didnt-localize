name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest test_tldl.py -v

      - name: Run TLDL on sample data (JSON)
        run: python tldl.py sample_strings.json --base en || true

      - name: Run TLDL on sample data (CSV)
        run: python tldl.py sample_strings.csv --base en || true
